services:
  - type: web
    name: nirbhid-news-api
    env: python
    region: singapore
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: news-media
      - key: CORS_ORIGINS
        value: "https://nirbhidnews.com,https://nirbhidnews.vercel.app,http://localhost:5173"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
